name: pages
# Publishes site/ as https://ilien-dev.github.io/muninn/, a landing page with its own title,
# description and structured data, so search engines have one page about Muninn besides the repo.
on:
  push:
    branches: [master]
    paths: ["site/**", "assets/muninn-*", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v7
      - name: assemble the site
        run: |
          mkdir -p _site/assets
          cp site/* _site/
          cp assets/muninn-light.svg assets/muninn-dark.svg assets/muninn-symbol.png assets/muninn-social.png _site/assets/
      - uses: actions/upload-pages-artifact@v5
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v5
