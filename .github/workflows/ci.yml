name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy, rustfmt }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --features exact-tokens -- -D warnings
      - run: cargo test --workspace --features exact-tokens
      - name: fault injection (11 scenarios x 200)
        run: MUNINN_FAULT_REPS=200 cargo test -p muninn-cli --release --test fault -- --nocapture
      - name: boot block budget
        run: cargo run --release -p muninn-cli --features exact-tokens -- init --check-budget
      - name: performance regressions
        run: cargo run --release -p muninn-bench -- perf --strict
  build:
    needs: test
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu, cross: true }
          - { os: macos-latest,   target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - if: matrix.cross
        run: cargo install cross --locked
      - if: matrix.cross
        run: cross build --release -p muninn-cli --target ${{ matrix.target }}
      - if: "!matrix.cross"
        run: cargo build --release -p muninn-cli --target ${{ matrix.target }}
      - name: size gate (<= 20 MB)
        shell: bash
        run: |
          f=$(ls target/${{ matrix.target }}/release/muninn* | grep -v '\.d$' | head -1)
          s=$(wc -c < "$f"); echo "$f $s bytes"; test "$s" -le 20971520
      - uses: actions/upload-artifact@v4
        with: { name: "muninn-${{ matrix.target }}", path: "target/${{ matrix.target }}/release/muninn*" }
