name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write   # Sigstore keyless signing
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu, cross: true }
          - { os: macos-latest,   target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - if: matrix.cross
        run: cargo install cross --locked
      - if: matrix.cross
        run: cross build --release -p muninn-cli --target ${{ matrix.target }}
      - if: "!matrix.cross"
        run: cargo build --release -p muninn-cli --target ${{ matrix.target }}
      - name: name the artefact
        shell: bash
        run: |
          mkdir -p dist
          src=$(ls target/${{ matrix.target }}/release/muninn* | grep -v '\.d$' | head -1)
          ext=""; case "$src" in *.exe) ext=".exe";; esac
          cp "$src" "dist/muninn-${{ matrix.target }}$ext"
          test "$(wc -c < "dist/muninn-${{ matrix.target }}$ext")" -le 20971520
      - uses: actions/upload-artifact@v4
        with: { name: "dist-${{ matrix.target }}", path: dist/* }
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      # plugin/bin/ is gitignored, so a plugin installed from the marketplace has no binary
      # until its SessionStart hook (plugin/scripts/session-start) downloads the asset for its
      # version from this release. The per-target bundles below are for installing by hand.
      - name: plugin bundles
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # A marketplace install takes its version from the manifests committed on the default
          # branch, and downloads the release of that version. Stamping them here would change
          # only this job's copy, so the tag has to match what is committed.
          # `every_manifest_carries_the_binary_version` keeps them equal to Cargo.toml.
          cargo_v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test "$cargo_v" = "$version" || { echo "tag v$version but Cargo.toml says $cargo_v" >&2; exit 1; }
          for bin in dist/muninn-*; do
            case "$bin" in *.sigstore.json|*.tar.gz) continue;; esac
            base=$(basename "$bin"); target=${base#muninn-}; ext=""
            case "$target" in *.exe) target=${target%.exe}; ext=".exe";; esac
            stage=$(mktemp -d)
            cp -r plugin "$stage/plugin"
            mkdir -p "$stage/plugin/bin"
            install -m 0755 "$bin" "$stage/plugin/bin/muninn$ext"
            tar -czf "dist/muninn-plugin-$target.tar.gz" -C "$stage" plugin
            rm -rf "$stage"
          done
          # the README points at install.sh as a release asset, with the tag's version
          # already substituted, so the download matches the release it came from
          sed "s|^VERSION=.*|VERSION=\"\${MUNINN_VERSION:-$version}\"|" \
              plugin/scripts/install.sh > dist/install.sh
          sh -n dist/install.sh
          ls -l dist
      - name: checksums
        run: cd dist && sha256sum muninn-* > checksums.txt && cat checksums.txt
      - uses: sigstore/cosign-installer@v3
      - name: sign (keyless, Sigstore)
        run: |
          cd dist
          for f in muninn-* checksums.txt; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: model checksums (the sidecar's model files, as pinned in muninn-embed)
        run: |
          cat > dist/models.txt <<'M'
          potion-base-8M  config.json        2a6ac0e9aaa356a68a5688070db78fc3a464fefe85d2f06a1905ce3718687553
          potion-base-8M  tokenizer.json     e67e803f624fb4d67dea1c730d06e1067e1b14d830e2c2202569e3ef0f70bb50
          potion-base-8M  model.safetensors  f65d0f325faadc1e121c319e2faa41170d3fa07d8c89abd48ca5358d9a223de2
          M
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
