name: branch-name
# Contributions reach master only through a pull request from <type>/<name>, <type> being a
# Conventional Commit type and <name>
# at least three lowercase words joined by single hyphens. master's ruleset requires this
# check; the maintainer can bypass it.
# Dependabot's own dependabot/... branches pass when Dependabot opened the pull request.
on:
  pull_request:
    branches: [master]
permissions: {}
jobs:
  branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: <type>/<three-or-more-words> into master
        env: { HEAD: "${{ github.head_ref }}", AUTHOR: "${{ github.event.pull_request.user.login }}" }
        run: |
          if [ "$AUTHOR" = "dependabot[bot]" ] && printf '%s' "$HEAD" | grep -Eq '^dependabot/'; then
            echo "ok: dependency update $HEAD"
            exit 0
          fi
          if printf '%s' "$HEAD" | grep -Eq '^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)/[a-z0-9]+(-[a-z0-9]+){2,}$'; then
            echo "ok: $HEAD"
          else
            echo "::error::branch '$HEAD' must be named <type>/<name>, <type> being one of feat, fix, perf, refactor, docs, test, build, ci, chore, style, revert and <name> at least three lowercase words joined by single hyphens (letters and digits only), e.g. fix/windows-install-paths"
            exit 1
          fi
