[workspace]
resolver = "2"
members = [
    "crates/muninn-core",
    "crates/muninn-cli",
    "crates/muninn-capture",
    "crates/muninn-compile",
    "crates/muninn-embed",
    "crates/muninn-symbols",
    "crates/muninn-why",
    "crates/muninn-bench",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/ilien-dev/muninn"
rust-version = "1.85"

[workspace.dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tiktoken-rs = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.bench]
inherits = "release"
